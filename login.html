<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/login.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="JS/login.js"></script>
  </head>
  <body>
    <section class="loginSection">
      <div class="loginWrapper">
        <!-- Logo -->
        <div class="loginContainerLogo">
          <img src="Image&Video/logo3.png" alt="OmniGuard Logo" />
        </div>

        <!-- Heading -->
        <div class="loginContainerH">
          <h2>OmniGuard Login</h2>
        </div>

        <!-- Login Card -->
        <div class="loginContainer">
          <div class="formContainer">
            <form id="login-form">
              <!-- Full Name -->
              <label>
                Full Name
                <span class="required-star">*</span>
              </label>

              <input
                type="text"
                placeholder="Enter your registered full name"
                id="userName"
                required
              />

              <!-- Email -->
              <label>
                Email
                <span class="required-star">*</span>
              </label>

              <input
                type="email"
                placeholder="Enter your registered email"
                id="userEmail"
                required
              />

              <!-- Password -->
              <label>
                Password
                <span class="required-star">*</span>
              </label>

              <div class="inputBox">
                <input
                  type="password"
                  placeholder="Enter your password"
                  id="userPassword"
                  required
                />
              </div>

              <!-- Login Button -->
              <button type="submit" class="loginBtn" onclick="userLogIn(event)">
                Log In
              </button>
            </form>
          </div>

          <!-- Switch -->
          <div class="auth-switch">
            <p class="switchToSignup">
              Don't have an account?
              <a href="signup.html" class="signupLink"> Create your account </a>
            </p>
          </div>

          <!-- Message -->
          <p class="massageLogin" id="message-display"></p>

          <!-- Back -->
          <div class="backToHome">
            <a href="index.html"> Back </a>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
